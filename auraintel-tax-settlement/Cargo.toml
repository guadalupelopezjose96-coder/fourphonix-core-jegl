[package]
name = "auraintel-tax-settlement"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "AuraIntel VPP - Deterministic Fiscal Settlement Engine (IRS IRIS 1099 & SAT CFDI 4.0)"
publish = false

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
