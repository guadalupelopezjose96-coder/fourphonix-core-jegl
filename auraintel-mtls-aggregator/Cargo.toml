[package]
name = "auraintel-mtls-aggregator"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "AuraIntel VPP - Zero-Trust TLS 1.3 mTLS Aggregator for IEEE 2030.5 & OpenADR"
publish = false

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.1"
axum = { version = "0.7", features = ["http2", "json"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http2"] }
tower-service = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
